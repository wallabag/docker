services:
  wallabag:
    extends:
      file: docker-compose.mariadb.yml
      service: wallabag
    image: wallabag:mariadb-secret
    environment:
      - SYMFONY__ENV__DATABASE_PASSWORD__FILE=/run/secrets/db_password
      - SYMFONY__ENV__SECRET__FILE=/run/secrets/env_secret
    secrets:
      - db_password
      - env_secret
  db:
    extends:
      file: docker-compose.mariadb.yml
      service: db

secrets:
  db_password:
    file: ./credentials/db_password
  env_secret:
    file: ./credentials/env_secret
